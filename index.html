<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bargain Hunter Dashboard (Wireframe)</title>
    <style>
        /* Strict Wireframe CSS - Default font, grayscale, simple borders/padding */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        header {
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 0;
            font-size: 24px;
            color: #000;
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 4px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        
        th {
            background-color: #f2f2f2;
            font-weight: 600;
            border-bottom: 2px solid #ccc;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        a {
            color: #0066cc;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            background-color: #fafafa;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        
        .badge-positive {
            font-weight: bold;
            border-color: #333;
            background-color: #eaeaea;
        }
        
        .badge-warning {
            border-color: #999;
            background-color: #f0f0f0;
            font-style: italic;
        }
        
        .features-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 350px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bargain Hunter Dashboard</h1>
            <p>Senast uppdaterad: <span id="last-updated"></span></p>
        </header>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Value Index</th>
                        <th>Titel</th>
                        <th>Modell</th>
                        <th>Pris</th>
                        <th>Miltal</th>
                        <th>Årsmodell</th>
                        <th>Plats</th>
                        <th>Utrustning & Analys</th>
                        <th>Typ</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
    </div>
    <script>
        document.getElementById('last-updated').textContent = new Date().toLocaleString('sv-SE');
    </script>
</body>
<!-- deploy trigger -->
</html>
